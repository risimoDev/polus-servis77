# Полюс Сервис 77 — лендинг + каталог.
# Только статика (nginx) + крошечный сервис отправки формы (mailer).
# Запуск:  docker compose up -d --build

services:

  mailer:
    build: ./mailer
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./:/var/www/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - mailer
