# ── Development: docker compose up
# Starts PostgreSQL + Redis for local Node.js development.
# Run the server locally: npm run dev
#
# ── Production: docker compose --profile prod up
# Starts full stack: DB + Redis + Node.js server + Nginx

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-polus}
      POSTGRES_PASSWORD: ${DB_PASS:-secret}
      POSTGRES_DB:       ${DB_NAME:-polus_servis}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-polus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    profiles: [prod]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./:/var/www/html:ro
      - ./storage/uploads:/var/www/html/storage/uploads
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
    profiles: [prod]

volumes:
  postgres_data:
