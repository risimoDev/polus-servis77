<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="300mm" height="300mm" version="1.1"
  style="shape-rendering:geometricPrecision; text-rendering:geometricPrecision; image-rendering:optimizeQuality; fill-rule:evenodd; clip-rule:evenodd"
  viewBox="0 0 300 300"
  xmlns:xlink="http://www.w3.org/1999/xlink">
 <defs>
  <style type="text/css">
   <![CDATA[
    .fil0 {fill:#E31E24}
    .fil1 {fill:#86241F}
    .fil4 {fill:#708AC5}
    .fil3 {fill:#2E4D9A}
    .fil5 {fill:#1C4178}
    .fil7 {fill:#E31E24;fill-rule:nonzero}
    .fil2 {fill:#E86265;fill-rule:nonzero}
    .fil6 {fill:#708AC5;fill-rule:nonzero}
    .fil9 {fill:#2E4D9A;fill-rule:nonzero}
    .fil8 {fill:url(#id0);fill-rule:nonzero}

    /* ── Site logo: sparkle only, NO rotation ─────────────────── */

    /* Snowflake — pulse glow, stays static */
    #logo-star {
      animation: lStarGlow 4s ease-in-out infinite;
    }

    /* Spark drops — scale pulse + blue glow */
    #logo-dot1 {
      transform-box: fill-box;
      transform-origin: center;
      animation: lDot 3.2s ease-in-out infinite;
    }
    #logo-dot2 {
      transform-box: fill-box;
      transform-origin: center;
      animation: lDot 3.2s ease-in-out infinite 1.1s;
    }

    /* Left red gear half — breathing red glow */
    #logo-gear-l {
      animation: lGlowR 5s ease-in-out infinite;
    }

    /* Right blue gear half — breathing blue glow (offset) */
    #logo-gear-r {
      animation: lGlowB 5s ease-in-out infinite 2.5s;
    }

    /* Text — shimmer sweep */
    #logo-text {
      animation: lShimmer 7s ease-in-out infinite;
    }

    /* ── Keyframes ────────────────────────────────────────────── */

    @keyframes lStarGlow {
      0%, 100% { filter: none; }
      50% {
        filter: drop-shadow(0 0 5px rgba(112, 138, 197, 0.8))
                drop-shadow(0 0 10px rgba(112, 138, 197, 0.35));
      }
    }

    @keyframes lDot {
      0%, 100% { transform: scale(1);    filter: none; }
      50%       { transform: scale(1.55);
                  filter: drop-shadow(0 0 6px rgba(112, 138, 197, 0.9))
                          drop-shadow(0 0 12px rgba(112, 138, 197, 0.4)); }
    }

    @keyframes lGlowR {
      0%, 100% { filter: none; }
      40% {
        filter: drop-shadow(0 0 10px rgba(227, 30, 36, 0.55))
                drop-shadow(0 0 22px rgba(227, 30, 36, 0.18));
      }
    }

    @keyframes lGlowB {
      0%, 100% { filter: none; }
      40% {
        filter: drop-shadow(0 0 10px rgba(46, 77, 154, 0.55))
                drop-shadow(0 0 22px rgba(46, 77, 154, 0.18));
      }
    }

    @keyframes lShimmer {
      0%,  100% { opacity: 1;    filter: none; }
      38%        { opacity: 0.72; filter: none; }
      55%        { opacity: 1;
                   filter: drop-shadow(0 0 5px rgba(227, 30, 36, 0.42))
                           drop-shadow(0 0 2px rgba(255, 255, 255, 0.22)); }
      72%        { opacity: 1;    filter: none; }
    }
   ]]>
  </style>
  <linearGradient id="id0" gradientUnits="userSpaceOnUse" x1="127.6783" y1="-332.9334" x2="161.6466" y2="-332.9334">
   <stop offset="0"        style="stop-opacity:1; stop-color:#E31E24"/>
   <stop offset="0.490196" style="stop-opacity:1; stop-color:#E31E24"/>
   <stop offset="1"        style="stop-opacity:1; stop-color:#2E4D9A"/>
  </linearGradient>
 </defs>
