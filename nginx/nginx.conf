user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # Performance
  sendfile           on;
  tcp_nopush         on;
  keepalive_timeout  65;

  # Compression
  gzip         on;
  gzip_vary    on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript
             application/x-javascript text/xml application/xml
             image/svg+xml font/woff2;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=static:10m rate=60r/s;

  # ── SEO: страницы услуг отдаём как готовый статический HTML ──────────────
  # service.html?id=<slug> → /service/<slug>.html (предрендер, см. scripts/prerender-services.cjs)
  # Краулер получает уникальные мета-теги и контент сразу, без выполнения JS.
  # Неизвестный/пустой id → обычный service.html (список услуг рендерит JS).
  map $arg_id $service_target {
    default                     /service.html;
    postavka-oborudovaniya      /service/postavka-oborudovaniya.html;
    montazh-itp                 /service/montazh-itp.html;
    tehnicheskoe-obsluzhivanie  /service/tehnicheskoe-obsluzhivanie.html;
    promyvka-teploobmennikov    /service/promyvka-teploobmennikov.html;
    zapasnye-chasti             /service/zapasnye-chasti.html;
    himicheskie-reagenty        /service/himicheskie-reagenty.html;
  }

  # HTTP → HTTPS redirect
  server {
    listen 80;
    server_name polus-servis77.ru www.polus-servis77.ru;
    return 301 https://$host$request_uri;
  }

  # HTTPS server
  server {
    listen 443 ssl http2;
    server_name polus-servis77.ru www.polus-servis77.ru;

    root /var/www/html;
    index index.html;

    # Своя страница 404 для несуществующих адресов и закрытых файлов
    error_page 404 /404.html;
    error_page 403 =404 /404.html;

    # Канонический хост: www → без www (301, чтобы не плодить дубли для поисковиков)
    if ($host = www.polus-servis77.ru) {
      return 301 https://polus-servis77.ru$request_uri;
    }

    # SSL (монтируется из хоста: ./nginx/ssl:/etc/nginx/ssl)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Modern SSL settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;

    # ── Закрываем служебные папки и файлы (отдают свою 404) ──────
    # Папки бэкенда, исходников, утилит и админки (вкл. «голое» /admin)
    location ~ ^/(src|server|migrations|prisma|node_modules|scripts|nginx|mailer|admin|storage)(/|$) {
      return 404;
    }
    # Файлы по расширению (исходники, конфиги, тексты-черновики, логи)
    location ~* \.(env|ini|log|sh|bash|cjs|mjs|ts|tsx|map|yml|yaml|lock|md|sql)$ {
      return 404;
    }
    # Конкретные служебные файлы
    location ~ ^/(composer\.(json|lock)|package(-lock)?\.json|tsconfig\.json|Dockerfile|docker-compose\.yml|yandex_522493\.json)$ {
      return 404;
    }
    # Скрытые файлы (.env, .git, .htaccess…), кроме .well-known (ACME/SSL)
    location ~ /\.(?!well-known) {
      return 404;
    }
    # PHP не используется — формы обрабатывает Node API
    location ~ \.php$ {
      return 404;
    }

    # Форма заявок → mailer-сервис
    location /api/ {
      limit_req zone=api burst=10 nodelay;
      proxy_pass         http://mailer:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Статика: кэш с обязательной ревалидацией (ассеты версионируются через ?v=)
    location /assets/ {
      limit_req zone=static burst=50 nodelay;
      expires 1h;
      add_header Cache-Control "public, must-revalidate" always;
    }

    # Страница услуги: отдаём предрендер по ?id=, иначе обычный service.html
    location = /service.html {
      try_files $service_target /service.html =404;
      expires -1;
    }

    # Только реально существующие страницы; всё прочее → 404
    location / {
      try_files $uri $uri/ =404;
      expires -1;
    }
  }
}
