user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # Performance
  sendfile           on;
  tcp_nopush         on;
  keepalive_timeout  65;

  # Compression
  gzip         on;
  gzip_vary    on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript
             application/x-javascript text/xml application/xml
             image/svg+xml font/woff2;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=static:10m rate=60r/s;

  # HTTP → HTTPS redirect
  server {
    listen 80;
    server_name polus-servis77.ru www.polus-servis77.ru;
    return 301 https://$host$request_uri;
  }

  # HTTPS server
  server {
    listen 443 ssl http2;
    server_name polus-servis77.ru www.polus-servis77.ru;

    root /var/www/html;

    # SSL (монтируется из хоста: ./nginx/ssl:/etc/nginx/ssl)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Modern SSL settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;

    # Block internal directories
    location ~ ^/(src|server|migrations|prisma|node_modules|\.(git|env)) {
      deny all;
      return 404;
    }

    # Block PHP entrypoints except send.php (legacy form handler)
    location ~ \.php$ {
      deny all;
    }
    location = /send.php {
      # Allow during landing-only phase; remove when Node.js API is active
      fastcgi_pass  unix:/var/run/php-fpm.sock;
      fastcgi_index index.php;
      include       fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # API → Node.js (active when --profile prod is used)
    location /api/ {
      limit_req zone=api burst=10 nodelay;
      proxy_pass         http://server:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Admin SPA
    location /admin/ {
      try_files $uri /admin/index.html;
    }

    # Static uploads
    location /storage/uploads/ {
      alias  /var/www/html/storage/uploads/;
      expires 30d;
      add_header Cache-Control "public";
    }

    # Long-lived static assets
    location /assets/ {
      limit_req zone=static burst=50 nodelay;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Landing page (catch-all)
    location / {
      try_files $uri $uri/ /index.html;
      expires -1;
    }
  }
}
