# Полюс Сервис — конфиг для /etc/nginx/conf.d/polus-servis77.conf
# Только директивы уровня http (без user/events/http-обёртки)

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m    rate=30r/m;
limit_req_zone $binary_remote_addr zone=static:10m rate=60r/s;

# HTTP → HTTPS redirect
server {
  listen 80;
  server_name polus-servis77.ru www.polus-servis77.ru;
  return 301 https://$host$request_uri;
}

# Основной сервер (HTTPS)
server {
  listen 443 ssl;
  http2  on;
  server_name polus-servis77.ru www.polus-servis77.ru;

  # SSL — пути подставит certbot (setup-ssl.sh), или раскомментируйте вручную
  ssl_certificate     /etc/letsencrypt/live/polus-servis77.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/polus-servis77.ru/privkey.pem;

  # Modern SSL settings
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # OCSP Stapling
  ssl_stapling        on;
  ssl_stapling_verify on;
  resolver            1.1.1.1 8.8.8.8 valid=300s;
  resolver_timeout    5s;

  root /opt/polus-servis77;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options    "nosniff"                                      always;
  add_header X-Frame-Options           "SAMEORIGIN"                                   always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;

  # Block internal directories
  location ~ ^/(src|server|migrations|prisma|node_modules|\.(git|env)) {
    deny all;
    return 404;
  }

  # Block PHP (нет PHP-FPM на чистом лендинге)
  location ~ \.php$ {
    deny all;
  }

  # API → Node.js (если используется)
  location /api/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Admin SPA
  location /admin/ {
    try_files $uri /admin/index.html;
  }

  # Static uploads
  location /storage/uploads/ {
    alias  /opt/polus-servis77/storage/uploads/;
    expires 30d;
    add_header Cache-Control "public";
  }

  # Static assets — долгий кэш
  location /assets/ {
    limit_req zone=static burst=50 nodelay;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # robots.txt, sitemap.xml — без кэша
  location ~* ^/(robots\.txt|sitemap\.xml)$ {
    expires -1;
  }

  # Landing page (catch-all)
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
