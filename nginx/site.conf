# Полюс Сервис — конфиг для /etc/nginx/conf.d/polus-servis77.conf
# Только директивы уровня http (без user/events/http-обёртки)

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m    rate=30r/m;
limit_req_zone $binary_remote_addr zone=static:10m rate=60r/s;

# HTTP → HTTPS redirect
server {
  listen 80;
  server_name polus-servis77.ru www.polus-servis77.ru;
  return 301 https://$host$request_uri;
}

# Основной сервер (HTTPS — заполнится certbot автоматически)
server {
  listen 443 ssl;
  http2  on;
  server_name polus-servis77.ru www.polus-servis77.ru;

  # SSL — пути подставит certbot, оставить пустыми до его запуска
  # ssl_certificate     /etc/letsencrypt/live/polus-servis77.ru/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/polus-servis77.ru/privkey.pem;

  root /opt/polus-servis77;

  # Security headers
  add_header X-Content-Type-Options  "nosniff"                            always;
  add_header X-Frame-Options         "SAMEORIGIN"                         always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin"    always;
  add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(self)" always;

  # Block internal directories
  location ~ ^/(src|server|migrations|prisma|node_modules|\.(git|env)) {
    deny all;
    return 404;
  }

  # Block PHP (нет PHP-FPM на чистом лендинге)
  location ~ \.php$ {
    deny all;
  }

  # Static assets — долгий кэш
  location /assets/ {
    limit_req zone=static burst=50 nodelay;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # robots.txt, sitemap.xml — без кэша
  location ~* ^/(robots\.txt|sitemap\.xml)$ {
    expires -1;
  }

  # Landing page (catch-all)
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
